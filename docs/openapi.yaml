openapi: 3.0.3
info:
  title: Multi-tenant Inventory and Order SaaS API
  version: 0.1.0
servers:
  - url: http://localhost:8080
paths:
  /organizations/{organizationId}/sessions:
    post:
      summary: Authenticate a user and issue a Bearer token
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 8 }
      responses: { '200': { description: Bearer token }, '401': { description: Invalid credentials } }
    put:
      summary: Exchange a refresh token for a short-lived access token
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses: { '200': { description: Refreshed access token }, '401': { description: Invalid refresh token } }
    delete:
      summary: Revoke the current session
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '204': { description: Revoked }, '401': { description: Invalid session } }
  /organizations/{organizationId}/sessions/password-reset:
    post:
      summary: Request a password reset instruction
      description: Always returns 202 to prevent account enumeration. The reset token is delivered asynchronously through the notification outbox.
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses: { '202': { description: Reset instruction accepted } }
    put:
      summary: Set a new password using a reset token
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, format: password, minLength: 8 }
      responses: { '204': { description: Password reset }, '401': { description: Invalid or expired token } }
  /organizations:
    post:
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganization' }
      responses: { '201': { description: Created } }
  /organizations/{organizationId}:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      summary: Get organization profile
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Organization profile, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }, '404': { description: Not found } }
    put:
      summary: Update organization name
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }, '404': { description: Not found } }
  /organizations/{organizationId}/orders:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      summary: List orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Order' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, confirmed, paid, shipped, completed, cancelled, refunded] }
      responses: { '200': { description: Paginated orders, content: { application/json: { schema: { $ref: '#/components/schemas/OrderPage' } } } } }
    post:
      summary: Create order and reserve stock
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrder' }
      responses: { '201': { description: Created }, '409': { description: Insufficient stock or conflict } }
  /organizations/{organizationId}/products:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      summary: List products in the organization
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
      responses: { '200': { description: Paginated products, content: { application/json: { schema: { $ref: '#/components/schemas/ProductPage' } } } } }
    post:
      summary: Create a product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateProduct' } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }, '409': { description: Conflict } }
  /organizations/{organizationId}/products/{productId}/skus:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/ProductId' }
    get:
      summary: List SKUs for a product
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
      responses: { '200': { description: Paginated SKUs, content: { application/json: { schema: { $ref: '#/components/schemas/SKUPage' } } } } }
    post:
      summary: Create a SKU under a product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateSKU' } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/SKU' } } } }, '409': { description: Conflict } }
  /organizations/{organizationId}/products/{productId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/ProductId' }
    put:
      summary: Update a product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateProduct' } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }, '404': { description: Not found }, '409': { description: Conflict } }
  /organizations/{organizationId}/products/{productId}/skus/{skuId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - { $ref: '#/components/parameters/ProductId' }
      - name: skuId
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Update a SKU
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateSKU' } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/SKU' } } } }, '404': { description: Not found }, '409': { description: Conflict } }
  /organizations/{organizationId}/warehouses:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      summary: List warehouses in the organization
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
      responses: { '200': { description: Paginated warehouses, content: { application/json: { schema: { $ref: '#/components/schemas/WarehousePage' } } } } }
    post:
      summary: Create a warehouse
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateWarehouse' } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }, '409': { description: Conflict } }
  /organizations/{organizationId}/warehouses/{warehouseId}:
    parameters:
      - { $ref: '#/components/parameters/OrganizationId' }
      - name: warehouseId
        in: path
        required: true
        schema: { type: string }
    put:
      summary: Update a warehouse
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateWarehouse' } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Warehouse' } } } }, '404': { description: Not found }, '409': { description: Conflict } }
  /organizations/{organizationId}/stocks:
    get:
      summary: List stock balances
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Query' }
        - { $ref: '#/components/parameters/Sort' }
        - { $ref: '#/components/parameters/Order' }
      responses: { '200': { description: Paginated stock balances, content: { application/json: { schema: { $ref: '#/components/schemas/StockPage' } } } } }
  /organizations/{organizationId}/warehouses/{warehouseId}/skus/{skuId}/stock:
    get:
      summary: Get one stock balance
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/WarehouseId' }
        - { $ref: '#/components/parameters/SkuId' }
      responses: { '200': { description: Stock balance, content: { application/json: { schema: { $ref: '#/components/schemas/Stock' } } } }, '404': { description: Not found } }
  /organizations/{organizationId}/warehouses/{warehouseId}/skus/{skuId}/stock/{action}:
    post:
      summary: Apply an idempotent stock operation
      description: Action is one of receive, reserve, release, or deduct. The operation is atomic and requires an idempotency key.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/WarehouseId' }
        - { $ref: '#/components/parameters/SkuId' }
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [receive, reserve, release, deduct] }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/StockOperation' } }
      responses: { '200': { description: Updated stock, content: { application/json: { schema: { $ref: '#/components/schemas/Stock' } } } }, '409': { description: Conflict or insufficient stock } }
  /organizations/{organizationId}/receipts:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      summary: List inbound receipt documents
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Order' }
      responses: { '200': { description: Paginated receipt documents, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } } }
    post:
      summary: Create an inbound receipt document
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateDocument' } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryDocument' } } } }, '409': { description: Conflict or insufficient stock } }
  /organizations/{organizationId}/receipts/{documentId}:
    get:
      summary: Get an inbound receipt document
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/DocumentId' }
      responses: { '200': { description: Receipt document, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryDocument' } } } }, '404': { description: Not found } }
  /organizations/{organizationId}/issues:
    parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
    get:
      summary: List outbound issue documents
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Order' }
      responses: { '200': { description: Paginated issue documents, content: { application/json: { schema: { $ref: '#/components/schemas/DocumentPage' } } } } }
    post:
      summary: Create an outbound issue document
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CreateDocument' } }
      responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryDocument' } } } }, '409': { description: Conflict or insufficient stock } }
  /organizations/{organizationId}/issues/{documentId}:
    get:
      summary: Get an outbound issue document
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/DocumentId' }
      responses: { '200': { description: Issue document, content: { application/json: { schema: { $ref: '#/components/schemas/InventoryDocument' } } } }, '404': { description: Not found } }
  /organizations/{organizationId}/orders/{orderId}/confirm:
    post:
      summary: Confirm order and deduct reserved stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses: { '200': { description: Confirmed } }
  /organizations/{organizationId}/orders/{orderId}/cancel:
    post:
      summary: Cancel order and release reserved stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses: { '200': { description: Cancelled } }
  /organizations/{organizationId}/orders/{orderId}/pay:
    post:
      summary: Mark a confirmed order as paid
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses: { '200': { description: Paid } }
  /organizations/{organizationId}/orders/{orderId}/ship:
    post:
      summary: Mark a paid order as shipped
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses: { '200': { description: Shipped } }
  /organizations/{organizationId}/orders/{orderId}/complete:
    post:
      summary: Mark a shipped order as completed
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses: { '200': { description: Completed } }
  /organizations/{organizationId}/orders/{orderId}/refund:
    post:
      summary: Refund a paid, shipped, or completed order and restore stock
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { $ref: '#/components/parameters/OrderId' }
      responses: { '200': { description: Refunded } }
  /organizations/{organizationId}/reports/summary:
    get:
      summary: Get tenant business summary
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - name: low_stock_threshold
          in: query
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
      responses: { '200': { description: Summary } }
  /organizations/{organizationId}/exports/orders/csv:
    get:
      summary: Export orders as CSV
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: CSV download, content: { text/csv: {} } } }
  /organizations/{organizationId}/exports/stocks/csv:
    get:
      summary: Export stocks as CSV
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: CSV download, content: { text/csv: {} } } }
  /organizations/{organizationId}/imports/stocks:
    post:
      summary: Validate and atomically import stock CSV
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      requestBody:
        required: true
        content:
          text/csv:
            schema: { type: string }
      responses: { '200': { description: Imported stock rows }, '400': { description: Invalid CSV } }
  /organizations/{organizationId}/audit-logs:
    get:
      summary: List the latest tenant audit entries
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Audit entry list } }
  /organizations/{organizationId}/webhooks:
    get:
      summary: List webhook subscriptions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Webhook subscription list } }
    post:
      summary: Create a webhook subscription
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, secret, event_types]
              properties:
                url: { type: string, format: uri }
                secret: { type: string, minLength: 16 }
                event_types: { type: array, items: { type: string } }
      responses: { '201': { description: Created }, '400': { description: Invalid input } }
  /organizations/{organizationId}/webhooks/{webhookId}:
    delete:
      summary: Delete a webhook subscription
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: webhookId, in: path, required: true, schema: { type: string } }
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /organizations/{organizationId}/alerts/stock:
    get:
      summary: Get the low-stock alert rule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      responses: { '200': { description: Alert rule }, '404': { description: Not configured } }
    put:
      summary: Create or update the low-stock alert rule
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/OrganizationId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold, enabled]
              properties:
                threshold: { type: integer, format: int64, minimum: 0 }
                enabled: { type: boolean }
      responses: { '200': { description: Alert rule }, '400': { description: Invalid input } }
  /organizations/{organizationId}/users/{userId}:
    put:
      summary: Update a user's profile, password, roles, or active status
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: userId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                password: { type: string, format: password, minLength: 8 }
                role_ids: { type: array, items: { type: string } }
                active: { type: boolean }
      responses: { '200': { description: Updated user }, '400': { description: Invalid input }, '404': { description: Not found } }
  /organizations/{organizationId}/roles/{roleId}:
    put:
      summary: Update a role name and permissions
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/OrganizationId' }
        - { name: roleId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                permissions: { type: array, items: { type: string } }
      responses: { '200': { description: Updated role }, '400': { description: Invalid input }, '404': { description: Not found } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-hmac-token
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string } }
    ProductId: { name: productId, in: path, required: true, schema: { type: string } }
    WarehouseId: { name: warehouseId, in: path, required: true, schema: { type: string } }
    SkuId: { name: skuId, in: path, required: true, schema: { type: string } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string } }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Query: { name: q, in: query, schema: { type: string } }
    Sort: { name: sort, in: query, schema: { type: string } }
    Order: { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
  schemas:
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer, minimum: 1 }
        page_size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    Product:
      type: object
      required: [id, organization_id, name]
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
    SKU:
      type: object
      required: [id, organization_id, product_id, code, name, price_cents]
      properties:
        id: { type: string }
        organization_id: { type: string }
        product_id: { type: string }
        code: { type: string }
        name: { type: string }
        price_cents: { type: integer, format: int64, minimum: 0 }
    Warehouse:
      type: object
      required: [id, organization_id, name]
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        address: { type: string }
        created_at: { type: string, format: date-time }
    Stock:
      type: object
      required: [organization_id, warehouse_id, sku_id, on_hand, reserved, available]
      properties:
        organization_id: { type: string }
        warehouse_id: { type: string }
        sku_id: { type: string }
        on_hand: { type: integer, format: int64 }
        reserved: { type: integer, format: int64 }
        available: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    Order:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        idempotency_key: { type: string }
        status: { type: string }
        total_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    InventoryDocument:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        document_type: { type: string, enum: [receipt, issue] }
        idempotency_key: { type: string }
        created_at: { type: string, format: date-time }
        lines: { type: array, items: { $ref: '#/components/schemas/DocumentLine' } }
    DocumentLine:
      type: object
      required: [warehouse_id, sku_id, quantity]
      properties:
        warehouse_id: { type: string }
        sku_id: { type: string }
        quantity: { type: integer, format: int64, minimum: 1 }
    CreateProduct:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    CreateSKU:
      type: object
      required: [code, name, price_cents]
      properties:
        code: { type: string }
        name: { type: string }
        price_cents: { type: integer, format: int64, minimum: 0 }
    CreateWarehouse:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: string }
    StockOperation:
      type: object
      required: [idempotency_key, quantity]
      properties:
        idempotency_key: { type: string }
