name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  # The persistence layer is only executed here: every other test in the repo
  # runs against the in-memory stores. Kept as a separate job so a database
  # hiccup never masks the fast unit-test signal.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saas
          POSTGRES_USER: saas
          POSTGRES_PASSWORD: saas
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U saas -d saas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://saas:saas@localhost:5432/saas?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Migrate
        shell: bash
        run: |
          set -euo pipefail
          for file in migrations/*.up.sql; do
            echo "applying $file"
            PGPASSWORD=saas psql -h localhost -U saas -d saas -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Integration test
        run: go test -tags=integration ./...
