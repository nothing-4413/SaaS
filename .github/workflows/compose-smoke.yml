name: compose-smoke

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start application stack
        run: docker compose up --build -d --wait
      - name: Run business smoke flow
        run: bash scripts/smoke.sh
      - name: Print service logs on failure
        if: failure()
        run: docker compose logs --no-color
      # Surface a short diagnosis as a check-run annotation, so the reason for a
      # failure is readable without downloading the (auth-only) job logs.
      - name: Annotate failure diagnostics
        if: failure()
        run: |
          set +e
          status=$(docker compose ps -a --format '{{.Service}}={{.Status}}' | tr '\n' ' ')
          tail_logs=$(docker compose logs --no-color --tail=25 2>&1 | tail -25 | tr '\n' '~' | tr -d '\r' | sed 's/%/%25/g')
          echo "::error title=compose container status::${status}"
          echo "::error title=compose log tail::${tail_logs}"
      - name: Stop application stack
        if: always()
        run: docker compose down -v
