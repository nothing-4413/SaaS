services:
  api:
    build: .
    environment:
      HTTP_ADDR: :8080
      APP_ENV: development
      DATABASE_URL: postgres://saas:saas@postgres:5432/saas?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AUTH_TOKEN_SECRET: development-only-change-me
    ports: ["8080:8080"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://saas:saas@postgres:5432/saas?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
  worker:
    build: .
    entrypoint: ["/usr/local/bin/saas-worker"]
    environment:
      DATABASE_URL: postgres://saas:saas@postgres:5432/saas?sslmode=disable
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 100
      STOCK_ALERT_INTERVAL_SECONDS: 60
      WORKER_HEALTH_ADDR: :9090
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saas
      POSTGRES_USER: saas
      POSTGRES_PASSWORD: saas
    ports: ["5432:5432"]
    volumes: ["saas-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saas -d saas"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  saas-postgres:
